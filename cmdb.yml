# cmdb.yml: the detailed record behind the short markdown docs in this repo.
# Edit here; keep the .md files short. No secrets or account IDs.

# ======================================================================
# CONTENTS  (search for the key name, e.g. 'sources:')
#
#   updated            last edit date
#   sources            every data source, how it is produced, licence
#   anomalies          planted ground-truth anomalies for the ML use cases
#   volumes            row counts and size of a full run
#   pipeline           raw -> Bronze -> Silver -> Gold, and where each lives
#   tests              what the test suite guarantees
#   toolchain          local setup and CI
#   status             what exists today
# ======================================================================

updated: "2026-09-26"

# Inventory. Explanations live in the control-plane stories (3.1-3.3 Bronze, 4.1 Silver):
# https://github.com/kheuchi/retail-finance-platform-control-plane/blob/main/docs/stories/README.md

# ──────────── sources ────────────
sources:
  story: "3.1"
  generated:
    - {name: stores, what: "~40 stores across regions, channels (store, online)"}
    - {name: products, what: "1,200 SKUs in 7 categories with cost and list price"}
    - {name: cashiers, what: "pseudonymous staff IDs per store, no names"}
    - {name: pos_sales, what: "daily transactions with seasonality, weekends, promotions, holidays"}
    - {name: refunds, what: "linked to sales where possible; some without receipt"}
    - {name: general_ledger, what: "journal lines derived from sales, refunds, costs; reconciles by design"}
    - {name: budget, what: "prior year x growth assumptions, by store and month"}
  real:
    - {name: fx_rates, source: "European Central Bank euro reference rates", licence: "free reuse with attribution", how: "small snapshot CSV committed to the repo"}
    - {name: holidays, source: "computed in code (fixed dates + Easter)", licence: "n/a"}
  rules:
    - "No real personal, customer or card data."
    - "Generator is seeded, so every run is reproducible."
    - "Nothing is downloaded at runtime: the workspace has no internet egress."

# ──────────── anomalies ────────────
anomalies:
  purpose: "Ground truth for the refund & margin leakage model"
  truth_files: "landing/_ground_truth/anomalies.csv (summary) and planted_records.csv (record ids)"
  planted:
    - "A1: store S017, cashier S017-C03, from 2026-08-01: no-receipt cash refunds ramping 1 -> 8 a day (218 records). S017 returns go from ~EUR 450/month to EUR 7.0k (Aug) and 12.5k (Sep)"
    - "A2: store S031, from 2026-06-01: extra discount on every line rising to 12% (margin erosion; store-level, no record ids)"
    - "A3: August 2026: 4 manual revenue journals (EUR 3-12k) with no POS sales behind them (GL vs POS reconciliation breaks)"

# ──────────── volumes ────────────
volumes:
  full_run: "2025-01-01 to 2026-09-25, 40 stores (35 DE + 1 online in EUR, 4 CH in CHF), 1,200 products"
  rows: {pos_sales: 3940360, refunds: 53297, gl_journal: 204294, budget: 480, cashiers: 235, fx_rates: 1329}
  size: "~482 MB CSV (pos_sales 459 MB)"
  local_runtime: "~2 min, ~370 MB RAM"
  sanity: "net revenue EUR 38.9m (2025); gross margin 34-35%; returns 1.4% of revenue; December peak EUR 4.3m"

# ──────────── pipeline ────────────
pipeline:
  landing: "Unity Catalog volume on the governed bucket (raw files)"
  bronze: "Auto Loader, append-only, schema captured"
  silver:
    job: "transform_silver (resources/silver.job.yml), entry point build_silver; full rebuild from Bronze on every run"
    rules: "per-source Spec in jobs/silver.py: types (try_cast), business key, required columns, SQL rules, references, EUR conversion"
    quarantine: "finance.silver.quarantine: source, record_key, reasons, original record as JSON; rebuilt per source"
    fx: "finance.silver.fx_daily: ECB rate per currency and day, last published rate carried over weekends and holidays; EUR = 1"
    invariant: "bronze = silver + quarantined + duplicates, per source; the job fails otherwise"
    story: "control plane docs/stories/4.1-silver-tables.md"
  gold:
    job: "build_gold (resources/gold.job.yml); first task reconcile_gl_pos, entry point reconcile_gl_pos"
    reconciliation: "gold.recon_gl_pos (store x day), gold.recon_gl_pos_monthly, gold.recon_exceptions; GL account 4000 vs POS net EUR (lines converted unrounded, day rounded once); tolerance EUR 0.01"
    attribution: "by amount, not label: no POS -> every revenue journal unsupported; one journal equals POS -> the others unsupported; several equal POS -> all reported as duplicate posting; none -> day reported, no journal blamed"
    guards: "refuses to write when POS or revenue lines are empty, an FX rate is missing, or pos_sales/gl_journal rows sit in silver.quarantine"
    limit: "revenue = REVENUE_ACCOUNTS (4000); fake revenue on another account is out of reach (accepted, story 4.2)"
    scoring: "ops.detection_scores: planted / found / missed / false positives vs landing/_ground_truth (synthetic data only)"
    finance_tables:
      task: "finance_tables (after reconcile_gl_pos), entry point build_gold_tables"
      tables: "gold.daily_revenue (store x channel x day), gold.margin (store x category x month), gold.refunds (store x cashier x month), gold.budget_variance (store x month)"
      definitions: "revenue = net sales EUR excl. VAT; gross margin = (net - cogs) / net; returns = refunds net of VAT; discount rate = discount / (paid + discount)"
      budget: "every store-month with sales in a budgeted year (has_budget flag); month in progress compared with revenue and cost budgets pro-rated to days with actuals (complete_month flag); ratios use try_divide"
      guards: "written only if Gold adds up to Silver (net sales, lines, cost, refund count and amount, budget-year store-months) and an allow-list holds: finance-analysts only USE CATALOG/BROWSE on the catalog and USE SCHEMA + SELECT on gold; no grant to analysts, account users or users below gold (SHOW GRANTS on catalog/schemas judged where granted, information_schema.table_privileges for tables)"
      naming: "paid_incl_vat_eur (not gross sales); net_sales_eur is before refunds; column comments on key columns"
      story: "control plane docs/stories/4.3-gold-finance-tables.md"
    quality:
      tasks: "quality_silver (first) and quality_gold (last) in build_gold; entry point quality_gate --stage silver|gold --run-id {{job.run_id}} --job-id {{job.id}}"
      critical: "silver_keys_unique and sales_have_masters (tripwires for Silver regressions), journals_balance, amounts_in_range (sales, refunds, ledger, in EUR), quarantine_money; gold_adds_up, silver_unchanged (Delta versions at the gold gate = those approved at the silver gate)"
      warning: "quarantine_masters, refund_within_sale (local currency), missing_store_days (open days from the holiday calendar with no sales), volume_collapse, row_count_drop (>5% vs previous run), lineage_traced"
      results: "ops.dq_results (run_id = Databricks run id), ops.silver_snapshot (versions and counts per run), ops.gold_certification (certified true/false per run: consumers use Gold only from certified runs)"
      lineage: "ops.lineage_evidence: table chains gold -> silver -> bronze from the UC lineage REST API (links written by this job), plus one Gold number traced to its Silver rows, Bronze rows and source files"
      identity: "gold gate runs runner_not_admin and runner_cannot_grant (tries a GRANT on silver as the job identity; must be refused; revoked at once if not)"
      accepted: "freshness (dataset static until scheduling, stage 6); broken-file run on the workspace (Bronze is append-only; proven by test on CSV-shaped rows)"
      story: "control plane docs/stories/4.4-quality-and-lineage.md"
    story: "control plane docs/stories/4.2-gl-pos-reconciliation.md"
  deploy: "Databricks Asset Bundle from GitHub Actions, service principal auth"
  compute: "finance-jobs cluster policy (job clusters: small, spot, single node default; stop when the job ends)"

# ──────────── ml ────────────
ml:
  job: "train_models (resources/ml.job.yml), entry point train_models; reads certified Gold only (latest ops.gold_certification row)"
  experiment: "bundle resource finance_ml at the deployer's workspace home; runner CAN_MANAGE"
  registry: "Unity Catalog finance.ml: fraud_cashier_refunds, fraud_store_margin, revenue_forecast (only if the model wins)"
  fraud_cashier: "IsolationForest (contamination 0.005) on cashier-month features vs store peers; scores in gold.fraud_scores"
  fraud_margin: "IsolationForest (contamination 0.02) on store-month margin drop and discount rise vs the store's own months 4-12 back (a creep cannot become its own baseline), net of the chain-wide move; scores in gold.margin_alerts"
  forecast: "gradient boosting (ratio to last year's month; features lag 12/1/2, month, horizon, store level) vs seasonal-naive baseline; backtest on last 3 complete months, 200 training rows per horizon; winner writes gold.revenue_forecast with an 80% range per horizon; registered only when the model wins (the baseline is a formula)"
  outputs: "gold.fraud_scores, gold.margin_alerts, gold.revenue_forecast carry gold_run and scored_at; written after MLflow logging and registration, so a failure leaves Gold untouched"
  review_2026_09_29: "independent review before merge: starved forecast training, missing signature for UC registration, false alarms not per month, answer-key dependency, partial writes, self-absorbing margin baseline, unstable ranks: all fixed; employee-level fraud scores readable by analysts: accepted risk R-12 (control plane)"
  probe_2026_09_29: "full data locally after review fixes: A1 rank 1 Aug and Sep (false alarms 3, 2); A2 rank 1 Jul, Aug, Sep (false alarms 0, 1, 0); forecast baseline MAPE 7.5% beats model 10.3%"
  story: "control plane docs/stories/5.1-fraud-detection.md, 5.2-revenue-forecast.md"

# ──────────── tests ────────────
tests:
  - "Same seed gives identical data"
  - "Every GL journal balances (debits = credits)"
  - "GL revenue from POS equals POS net sales in EUR, per store and day"
  - "Physical stores are closed on Sundays and national holidays"
  - "Receipted refunds point at real sales; no-receipt ones point at nothing"
  - "Planted anomalies exist and match the ground-truth file"
  - "Budget = prior-year actuals x 1.05"
  - "Easter dates correct (holiday calendar)"
  - "Silver: clean generated data passes untouched (0 quarantined, 0 duplicates, counts equal)"
  - "Silver: columns get real types (date, timestamp, int, decimal, boolean)"
  - "Silver: CHF amounts converted at the last ECB rate published on or before the day (Saturdays included)"
  - "Silver: bad rows quarantined with the right reason (bad type, negative quantity, unknown store, gross != net + vat, missing sku); later duplicate wins"
  - "Silver: receipted refunds must point at a real sale"
  - "Silver: the count check fails when rows go missing"
  - "Reconciliation: flags exactly the 4 planted A3 journals (4 found, 0 missed, 0 false positives)"
  - "Reconciliation: every other store-day matches to the cent"
  - "Reconciliation: a fake revenue journal labelled POS is still caught (amounts, not labels)"
  - "Reconciliation: sales missing from the books are reported as an unattributed difference"
  - "Reconciliation: a fake equal to the POS total is reported with the genuine journal as a duplicate posting (no alphabetical tie-break)"
  - "Reconciliation: a fake on a day without sales is unsupported"
  - "Reconciliation: when no journal matches, the day is reported once and no journal is blamed"
  - "Reconciliation: monthly differences equal the planted amounts per store"
  - "Reconciliation: refuses incomplete inputs (no sales, missing FX rate, rows in quarantine); answer key missing = not scored, present but empty = failure"
  - "Gold: tables add up to Silver (net sales, lines, transactions, refunds); a doubling join is caught"
  - "Gold: A2 discount creep visible (planted store's discount rate rises after start); A1 points at one cashier (>50% of no-receipt refunds)"
  - "Gold: budget variance pro-rates the month in progress"
  - "Gold: access allow-list ignores inherited rows, rejects schema-, table- and catalog-level leaks, MODIFY on gold, broad groups, and missing USE SCHEMA/SELECT on gold"
  - "Gold: budget variance keeps store-months without budget and survives a zero budget"
  - "Quality: clean data passes both gates (all checks)"
  - "Quality: one ledger line edited in the landing file passes Silver row rules but fails journals_balance and stops the run, naming the journal"
  - "Quality: duplicate keys and absurd amounts are critical; a one-day volume collapse is a warning that does not stop the run"
  - "Quality: Gold that no longer adds up to Silver is critical"
  - "Quality: quarantined money rows are critical, master rows only warn"
  - "Quality: a missing store-day file and a refund larger than its sale are flagged"
  - "Quality: Silver changing between the gates is critical; a >5% row-count drop warns"
  - "Quality: lineage chains keep only this job's links and reach Bronze (fake lineage API)"
  - "ML: no answer-key column is a model feature"
  - "ML: cashier detector ranks a planted fraudster first; margin detector finds a creeping store and ignores a chain-wide promotion"
  - "ML: baseline = last year x recent growth; backtest picks the better method; forecast ranges are ordered"

# ──────────── toolchain ────────────
toolchain:
  local: "WSL2; project venv in .venv (numpy, pandas, pyspark 4.0, pytest, ruff, build) installed 2026-09-26"
  java: "Temurin 17 JRE in ~/.local/jdk17 (user install, no sudo) on 2026-09-26, for local Spark tests; export JAVA_HOME=$HOME/.local/jdk17"
  databricks_cli: "v1.18.0 binary installed in ~/.local/bin on 2026-09-26 (no sudo)"
  ci: "ci.yml: ruff + pytest (incl. local Spark, runner's Java 17) on Python 3.12, bundle validate; deploy.yml: manual, typed 'deploy', choice of job to run (none, generate_and_ingest, transform_silver, build_gold)"
  auth: "deploy as finance-data-deployer (DATABRICKS_CLIENT_ID variable + DATABRICKS_CLIENT_SECRET secret, set 2026-09-28); jobs run as finance-pipeline-runner (run_as); terraform-platform no longer used by this repo (story 4.5)"
  runtime: "wheel with no dependencies, uploaded to UC volume finance.ops.artifacts; numpy/pandas/pyspark come from Databricks Runtime 17.3 LTS"
  security: "bundle deployed to the service principal's own folder, not /Workspace/Shared (would let any user edit code that runs as the principal)"

