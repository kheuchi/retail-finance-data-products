name: Agent on Google Agent Runtime

# Deploys the month-end agents to Vertex AI Agent Engine (ADR-006 deviation, D-032) through
# Workload Identity Federation: no Google key exists. Identifiers come from repo variables.
on:
  push:
    branches: [main]
    paths: ["agents/month_end_close/**", ".github/workflows/agent-gcp.yml"]
  workflow_dispatch:
    inputs:
      run_month:
        description: Close month to run after deploying (YYYY-MM, empty = deploy only)
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: agent-gcp
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy (and optionally run)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: agent-gcp  # a person approves every deployment (review of D-032)
    defaults:
      run:
        working-directory: agents/month_end_close
    env:
      GCP_PROJECT: ${{ vars.GCP_PROJECT }}
      GCP_STAGING_BUCKET: ${{ vars.GCP_STAGING_BUCKET }}
      GCP_RUNTIME_SA: ${{ vars.GCP_RUNTIME_SA }}
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      GATEWAY_URL: ${{ vars.GATEWAY_URL }}
      AGENT_GCP_ROLE_ARN: ${{ vars.AGENT_GCP_ROLE_ARN }}
      AGENT_MODEL_ID: ${{ vars.AGENT_MODEL_ID || 'gemini-3.8-flash' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install deploy dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-google.txt
      - name: Deploy to Agent Runtime
        run: python deploy_google.py
      - name: Run the close
        if: inputs.run_month != ''
        env:
          MONTH: ${{ inputs.run_month }}
        run: |
          set -o pipefail
          [[ "$MONTH" =~ ^[0-9]{4}-(0[1-9]|1[0-2])$ ]] || { echo "month must be YYYY-MM"; exit 1; }
          python run_google.py "$MONTH" | tee -a "$GITHUB_STEP_SUMMARY"
