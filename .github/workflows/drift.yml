name: Config drift

# Nightly: does the workspace still match main? A hand edit in the workspace (or a merge not
# yet deployed) fails this workflow, and GitHub emails the failure (story 6.2).
on:
  schedule:
    - cron: "30 3 * * *"  # 05:30 Berlin (summer time), before the 06:00 pipeline
  workflow_dispatch:

concurrency:
  group: config-drift  # own group: sharing the deploy group could replace a pending deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    name: Compare workspace with main
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
      BUNDLE_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install wheel builder
        run: python -m pip install --disable-pip-version-check build
      - uses: databricks/setup-cli@9230f12203ef173d0b901846f62a55ce997efef7 # v1.19.0
      - name: Alert address is set
        run: test -n "$BUNDLE_VAR_alert_email" || { echo "ALERT_EMAIL secret is missing or empty"; exit 1; }
      - name: Plan against the workspace
        run: databricks bundle plan -t prod -o json > plan.json
      - name: Fail on any pending change
        run: PYTHONPATH=src python -m retail_finance_data.config_drift plan.json
