# Databricks Asset Bundle: code, job definition and deployment target in one place.
# Deployed by GitHub Actions (deploy.yml), never by hand.

bundle:
  name: retail-finance-data-products

include:
  - resources/*.yml

artifacts:
  # The package is built into a wheel and installed on the job cluster from the
  # workspace. It declares no dependencies, so nothing is fetched from PyPI: the
  # cluster has no internet access.
  default:
    type: whl
    build: python -m build --wheel
    path: .

variables:
  catalog:
    description: Unity Catalog catalog holding raw, bronze, silver and gold.
    default: finance
  jobs_policy_id:
    description: Job-cluster policy capping size and cost (created by the infra repo).
    lookup:
      cluster_policy: finance-jobs
  runner:
    description: >
      Application ID of finance-pipeline-runner, the identity jobs run as (story 4.5).
      It can read and write the finance schemas and nothing else. The bundle itself is
      deployed by finance-data-deployer (GitHub Actions credentials). Not a secret.
    default: 11af38fd-b618-4649-80db-40092db9713b
  alert_email:
    description: >
      Where failure and slow-run emails go. Set from the ALERT_EMAIL GitHub secret
      (BUNDLE_VAR_alert_email), so the address is not in this public repo.
  schedule_pause_status:
    description: >
      PAUSED or UNPAUSED for the pipeline's daily schedule. Committed PAUSED: no daily
      spend before the trial ends (story 6.1). Flip here and deploy, never in the UI.
    default: PAUSED

targets:
  prod:
    mode: production
    default: true
    workspace:
      host: https://dbc-011bcfbf-172d.cloud.databricks.com
      # Deployed into the service principal's own folder. /Workspace/Shared would let
      # any workspace user edit code that then runs with the principal's privileges.
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
      # Wheels are uploaded to a Unity Catalog volume, not workspace files. The first
      # job cluster could not read its wheel from the workspace folder; the volume is
      # in our S3 bucket, reached through the S3 gateway endpoint.
      artifact_path: /Volumes/${var.catalog}/ops/artifacts/${bundle.name}/${bundle.target}
    run_as:
      service_principal_name: ${var.runner}
