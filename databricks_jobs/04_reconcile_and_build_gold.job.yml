resources:
  jobs:
    build_gold:
      name: "[finance] build gold"
      description: >
        Builds finance.gold from finance.silver, between two quality gates (critical
        checks stop the run; results in finance.ops.dq_results). Reconcile general-ledger
        revenue with POS sales per store and day, list every difference with the journal
        that causes it, and score detection against the generator's answer key.
        Second task: the finance tables (daily revenue, margin, refunds, budget variance),
        written only if they add up to Silver and analysts cannot read below Gold. The last
        gate checks Gold and writes lineage evidence (Gold -> Silver -> Bronze -> file).
      max_concurrent_runs: 1
      queue:
        enabled: true  # a run that finds the job busy waits instead of being skipped
      timeout_seconds: 3600
      # The pipeline (story 6.1) runs as the runner and starts this job: the runner needs
      # CAN_MANAGE_RUN here. It can only start and cancel runs that already run as itself.
      permissions:
        - service_principal_name: ${var.runner}
          level: CAN_MANAGE_RUN
      tags:
        CostCenter: finance-data-platform
        Layer: gold

      job_clusters:
        - job_cluster_key: finance_jobs
          new_cluster:
            policy_id: ${var.jobs_policy_id}
            apply_policy_default_values: true
            spark_version: 17.3.x-scala2.13
            node_type_id: m6gd.large
            num_workers: 0
            data_security_mode: SINGLE_USER
            single_user_name: ${var.runner}
            spark_conf:
              spark.databricks.cluster.profile: singleNode
              spark.master: local[*]
            custom_tags:
              ResourceClass: SingleNode

      tasks:
        - task_key: quality_silver
          job_cluster_key: finance_jobs
          python_wheel_task:
            package_name: retail_finance_data
            entry_point: quality_gate
            parameters: ["--catalog", "${var.catalog}", "--stage", "silver", "--run-id", "{{job.run_id}}", "--job-id", "{{job.id}}"]
          libraries:
            - whl: ../dist/*.whl  # relative to this file, not the repo root

        - task_key: reconcile_gl_pos
          depends_on:
            - task_key: quality_silver
          job_cluster_key: finance_jobs
          python_wheel_task:
            package_name: retail_finance_data
            entry_point: reconcile_gl_pos
            parameters: ["--catalog", "${var.catalog}"]
          libraries:
            - whl: ../dist/*.whl  # relative to this file, not the repo root

        - task_key: finance_tables
          depends_on:
            - task_key: reconcile_gl_pos
          job_cluster_key: finance_jobs
          python_wheel_task:
            package_name: retail_finance_data
            entry_point: build_gold_tables
            parameters: ["--catalog", "${var.catalog}"]
          libraries:
            - whl: ../dist/*.whl  # relative to this file, not the repo root

        - task_key: quality_gold
          depends_on:
            - task_key: finance_tables
          job_cluster_key: finance_jobs
          python_wheel_task:
            package_name: retail_finance_data
            entry_point: quality_gate
            parameters: ["--catalog", "${var.catalog}", "--stage", "gold", "--run-id", "{{job.run_id}}", "--job-id", "{{job.id}}"]
          libraries:
            - whl: ../dist/*.whl  # relative to this file, not the repo root
