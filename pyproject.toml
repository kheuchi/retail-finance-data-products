[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "retail-finance-data"
version = "0.1.0"
description = "Synthetic retail accounting data and its Databricks ingestion"
requires-python = ">=3.10"
# Deliberately empty. numpy, pandas and pyspark come with the Databricks Runtime,
# and the workspace has no internet egress, so pip could not fetch anything anyway.
dependencies = []

[project.optional-dependencies]
# pyspark matches Databricks Runtime 17.3 LTS (Spark 4.0); the Silver tests need Java 17+.
dev = ["numpy>=1.26,<3", "pandas>=2.2,<3", "pyspark>=4.0,<4.3", "pytest>=8", "ruff>=0.6", "scikit-learn>=1.5,<1.8"]

[project.scripts]
generate = "retail_finance_data.source_simulator.write_landing_files:main"
ingest_bronze = "retail_finance_data.bronze.ingest:main"
build_silver = "retail_finance_data.silver.build:main"
reconcile_gl_pos = "retail_finance_data.gold.reconcile_gl_pos:main"
build_gold_tables = "retail_finance_data.gold.build_tables:main"
quality_gate = "retail_finance_data.data_quality.quality_gate:main"
train_models = "retail_finance_data.ml.train_models:main"
create_agent_tools = "retail_finance_data.agent_tools.publish:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"retail_finance_data.source_simulator" = ["reference/*.csv"]
"retail_finance_data.agent_tools" = ["*.sql"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E731"]
